<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="625" viewBox="0 0 1800 625">
<title>장시간 ECG 리듬 분류 시스템</title><desc>AFE와 SAR ADC의 ECG 출력을 AXI-Stream으로 받아 특징 추출, Snapshot 요약과 Final Membrane 누적을 수행한다. 외부 제어기는 AXI-Lite로 명령과 결과를 교환하고 IRQ로 완료를 통보받는다. 기능 단계별 구성도이다.</desc>
<defs>
<marker id="data" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#2f855a"/></marker>
<marker id="ctrl" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#2866a0"/></marker>
<marker id="irq" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#d76a0a"/></marker>
</defs><rect width="1800" height="625" fill="white"/>
<text x="35" y="47" text-anchor="start" font-family="Arial,Malgun Gothic,sans-serif" font-size="36" font-weight="700" fill="#182230">장시간 ECG 리듬 분류 시스템</text>
<rect x="565" y="90" width="1195" height="465" rx="12" fill="none" stroke="#47739a" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1160" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="32" font-weight="700" fill="#182230">디지털 리듬 분류 IP</text>
<text x="300" y="130" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="30" font-weight="700" fill="#182230">아날로그 신호 처리</text>
<rect x="95" y="190" width="180" height="150" rx="9" fill="#ecfdf3" stroke="#2f855a" stroke-width="2"/>
<text x="185.0" y="255.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="29" font-weight="600" fill="#182230">AFE</text>
<text x="185.0" y="296.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="27" font-weight="600" fill="#182230">증폭 / 필터</text>
<rect x="325" y="190" width="180" height="150" rx="9" fill="#ecfdf3" stroke="#2f855a" stroke-width="2"/>
<text x="415.0" y="255.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="29" font-weight="600" fill="#182230">SAR ADC</text>
<text x="415.0" y="296.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="24" font-weight="600" fill="#182230">12-bit, 1 kSPS</text>
<rect x="600" y="210" width="190" height="110" rx="9" fill="#eaf2fb" stroke="#47739a" stroke-width="2"/>
<text x="695.0" y="255.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="29" font-weight="600" fill="#182230">ECG 입력</text>
<text x="695.0" y="296.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="26" font-weight="600" fill="#182230">AXI-Stream</text>
<rect x="860" y="190" width="215" height="150" rx="9" fill="#eaf2fb" stroke="#47739a" stroke-width="2"/>
<text x="967.5" y="255.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="29" font-weight="600" fill="#182230">특징 추출</text>
<text x="967.5" y="296.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="28" font-weight="600" fill="#182230">박동 / 파형</text>
<rect x="1140" y="190" width="215" height="150" rx="9" fill="#f4f3ff" stroke="#8064b5" stroke-width="2"/>
<text x="1247.5" y="255.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="29" font-weight="600" fill="#182230">Snapshot</text>
<text x="1247.5" y="296.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="28" font-weight="600" fill="#182230">60초 요약</text>
<rect x="1420" y="190" width="290" height="150" rx="9" fill="#f4f3ff" stroke="#8064b5" stroke-width="2"/>
<text x="1565.0" y="234.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="28" font-weight="600" fill="#182230">Final Membrane</text>
<text x="1565.0" y="274.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="27" font-weight="600" fill="#182230">장기 누적 / 판정</text>
<text x="1565.0" y="314.0" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="600" fill="#182230">NSR / AF / OTHER</text>
<text x="44" y="233" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="600" fill="#182230">ECG</text>
<polyline points="12,265 95,265" fill="none" stroke="#2f855a" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/>
<polyline points="275,265 325,265" fill="none" stroke="#2f855a" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/>
<polyline points="505,265 600,265" fill="none" stroke="#2f855a" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/>
<polyline points="790,265 860,265" fill="none" stroke="#2f855a" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/>
<polyline points="1075,265 1140,265" fill="none" stroke="#2f855a" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/>
<polyline points="1355,265 1420,265" fill="none" stroke="#2f855a" stroke-width="3" stroke-linejoin="round" marker-end="url(#data)"/>
<text x="553" y="243" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="24" font-weight="600" fill="#182230">12-bit</text>
<text x="1107" y="177" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="24" font-weight="600" fill="#182230">특징 근거</text>
<text x="1387" y="177" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="24" font-weight="600" fill="#182230">결과 + 근거</text>
<rect x="140" y="430" width="360" height="95" rx="9" fill="#f3f4f6" stroke="#7f8c9e" stroke-width="2"/>
<text x="320.0" y="487.5" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="29" font-weight="600" fill="#182230">외부 제어기</text>
<rect x="905" y="430" width="595" height="95" rx="9" fill="#eaf2fb" stroke="#47739a" stroke-width="2"/>
<text x="1202.5" y="487.5" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="29" font-weight="600" fill="#182230">제어 및 결과 레지스터</text>
<text x="704" y="409" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#182230">AXI-Lite</text>
<polyline points="500,453 905,453" fill="none" stroke="#2866a0" stroke-width="3" stroke-linejoin="round" marker-end="url(#ctrl)"/>
<text x="698" y="446" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="500" fill="#182230">제어 명령</text>
<polyline points="905,502 500,502" fill="none" stroke="#2866a0" stroke-width="3" stroke-linejoin="round" marker-end="url(#ctrl)"/>
<text x="698" y="494" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="500" fill="#182230">상태 / 결과 읽기</text>
<polyline points="970,430 970,340" fill="none" stroke="#2866a0" stroke-width="3" stroke-linejoin="round" marker-end="url(#ctrl)"/>
<text x="996" y="391" text-anchor="start" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="500" fill="#182230">시작</text>
<polyline points="1640,340 1640,478 1500,478" fill="none" stroke="#2866a0" stroke-width="3" stroke-linejoin="round" marker-end="url(#ctrl)"/>
<text x="1663" y="406" text-anchor="start" font-family="Arial,Malgun Gothic,sans-serif" font-size="25" font-weight="500" fill="#182230">결과</text>
<polyline points="1260,525 1260,585 320,585 320,525" fill="none" stroke="#d76a0a" stroke-width="3" stroke-linejoin="round" marker-end="url(#irq)"/>
<text x="800" y="614" text-anchor="middle" font-family="Arial,Malgun Gothic,sans-serif" font-size="28" font-weight="600" fill="#a4510c">완료 알림 (IRQ)</text>
</svg>